name: Build and publish CloudStream plugin

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to the builds branch"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: cloudstream-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate, test and build plugins
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          path: source

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          gradle-version: '8.12'

      - name: Run provider unit tests, build .cs3 and generate plugin index
        working-directory: source
        run: |
          set -euo pipefail
          attempt=1
          until gradle testDebugUnitTest make makePluginsJson --stacktrace; do
            if [ "$attempt" -ge 3 ]; then
              echo "Build failed after $attempt attempts. Inspect the Gradle log above; if JitPack is still unavailable this is an upstream dependency outage."
              exit 1
            fi
            delay=$((attempt * 20))
            echo "Gradle build attempt $attempt failed; retrying after ${delay}s."
            sleep "$delay"
            attempt=$((attempt + 1))
          done
          test -s build/plugins.json
          python -m json.tool repo.json >/dev/null
          python -m json.tool build/plugins.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path

          index = json.loads(Path("build/plugins.json").read_text(encoding="utf-8"))
          if not isinstance(index, list) or not index:
              raise SystemExit("build/plugins.json must be a non-empty JSON array")
          artifacts = list(Path(".").rglob("*.cs3"))
          if not artifacts:
              raise SystemExit("Build did not produce any .cs3 plugin artifacts")
          print(f"Validation passed: {len(index)} index entries, {len(artifacts)} .cs3 artifact(s)")
          PY

      - name: Test repository validator
        working-directory: source
        run: python -m unittest discover -s tools/tests -v

      - name: Validate repository and generated artifacts
        working-directory: source
        run: python tools/validate_repo.py --root . --require-artifacts

      - name: Validate live probe script syntax
        working-directory: source
        run: python -m py_compile tools/selcukflix_live_probe.py

      - name: Run read-only SelcukFlix live source probe
        working-directory: source
        continue-on-error: true
        run: |
          python tools/selcukflix_live_probe.py > selcukflix-live-probe.json
          cat selcukflix-live-probe.json

      - name: Upload SelcukFlix live diagnostic report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: selcukflix-live-probe
          path: source/selcukflix-live-probe.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload validated plugin build
        uses: actions/upload-artifact@v7
        with:
          name: cloudstream-plugin-build
          path: |
            source/repo.json
            source/build/plugins.json
            source/**/*.cs3
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish and verify builds branch artifacts
    needs: build
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish == true)) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: cloudstream-publish
      cancel-in-progress: false
    steps:
      - name: Download the exact validated build
        uses: actions/download-artifact@v8
        with:
          name: cloudstream-plugin-build
          path: publish-input

      - name: Publish to builds branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          if git ls-remote --heads "${REMOTE}" refs/heads/builds | grep -q refs/heads/builds; then
            git clone --depth 1 --single-branch --branch builds "${REMOTE}" publish
          else
            mkdir publish
            git -C publish init --initial-branch=builds
            git -C publish remote add origin "${REMOTE}"
          fi

          find publish -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp publish-input/repo.json publish/repo.json
          cp publish-input/build/plugins.json publish/plugins.json
          find publish-input -type f -name '*.cs3' -exec cp {} publish/ \;
          count=$(find publish -maxdepth 1 -type f -name '*.cs3' | wc -l)
          test "${count}" -ge 1
          python - <<'PY'
          import json
          from pathlib import Path

          index = json.loads(Path("publish/plugins.json").read_text(encoding="utf-8"))
          if not isinstance(index, list) or not index:
              raise SystemExit("plugins.json is empty or has an unexpected format")
          for item in index:
              filename = item.get("url", "").rsplit("/", 1)[-1]
              artifact = Path("publish") / filename
              if not artifact.is_file():
                  raise SystemExit(f"Manifest artifact missing from publish output: {filename}")
              if artifact.stat().st_size != item.get("fileSize"):
                  raise SystemExit(f"Artifact size mismatch before publish: {filename}")
          print(f"Publishing {len(index)} index entries and {len(list(Path('publish').glob('*.cs3')))} .cs3 artifacts")
          PY

          git -C publish config user.name "github-actions[bot]"
          git -C publish config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C publish add -A
          if git -C publish diff --cached --quiet; then
            echo "No build output changes to publish."
          else
            git -C publish commit -m "Publish CloudStream plugin for ${GITHUB_SHA::7}"
            git -C publish push origin builds
          fi

      - name: Verify publicly served plugin files against manifest
        run: |
          python - <<'PY'
          import hashlib
          import json
          import time
          import urllib.error
          import urllib.request

          manifest_url = "https://raw.githubusercontent.com/berr49300/cloudstream-film-repo/builds/plugins.json"
          def fetch(url):
              request = urllib.request.Request(url, headers={"User-Agent": "CloudStream-Repo-Artifact-Check"})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return response.read()

          last_error = None
          for attempt in range(1, 6):
              try:
                  manifest_bytes = fetch(manifest_url)
                  break
              except Exception as exc:
                  last_error = exc
                  if attempt == 5:
                      raise SystemExit(f"Could not fetch published plugins.json: {last_error}")
                  time.sleep(attempt * 5)

          manifest = json.loads(manifest_bytes)
          failures = []
          for item in manifest:
              url = item.get("url", "")
              try:
                  data = None
                  last_error = None
                  for attempt in range(1, 6):
                      try:
                          data = fetch(url)
                          break
                      except Exception as exc:
                          last_error = exc
                          if attempt < 5:
                              time.sleep(attempt * 5)
                  if data is None:
                      raise RuntimeError(f"download failed: {last_error}")
                  actual_size = len(data)
                  expected_size = item.get("fileSize")
                  actual_hash = "sha256-" + hashlib.sha256(data).hexdigest()
                  expected_hash = item.get("fileHash")
                  if actual_size != expected_size or actual_hash != expected_hash:
                      raise RuntimeError(
                          f"metadata mismatch: size {actual_size}/{expected_size}, "
                          f"hash {actual_hash}/{expected_hash}"
                      )
                  print(f"PASS {item.get('internalName')}: public download, size and SHA-256 match")
              except Exception as exc:
                  failures.append(f"{item.get('internalName')}: {exc}")
          if failures:
              raise SystemExit("Published artifact verification failed:\n" + "\n".join(failures))
          print("All public plugin downloads match the published manifest.")
          PY
