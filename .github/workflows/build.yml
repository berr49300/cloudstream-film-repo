name: Build and publish CloudStream plugin

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to the builds branch (requires explicit approval)"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: cloudstream-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate, test and build plugins
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          path: source

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          gradle-version: '8.12'

      - name: Run provider unit tests, build .cs3 and generate plugin index
        working-directory: source
        run: |
          set -euo pipefail
          gradle testDebugUnitTest make makePluginsJson --stacktrace
          test -s build/plugins.json
          python -m json.tool repo.json >/dev/null
          python -m json.tool build/plugins.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path

          index = json.loads(Path("build/plugins.json").read_text(encoding="utf-8"))
          if not isinstance(index, list) or not index:
              raise SystemExit("build/plugins.json must be a non-empty JSON array")
          artifacts = list(Path(".").rglob("*.cs3"))
          if not artifacts:
              raise SystemExit("Build did not produce any .cs3 plugin artifacts")
          print(f"Validation passed: {len(index)} index entries, {len(artifacts)} .cs3 artifact(s)")
          PY

      - name: Test repository validator
        working-directory: source
        run: python -m unittest discover -s tools/tests -v

      - name: Validate repository and generated artifacts
        working-directory: source
        run: python tools/validate_repo.py --root . --require-artifacts

      - name: Upload validated plugin build
        uses: actions/upload-artifact@v7
        with:
          name: cloudstream-plugin-build
          path: |
            source/repo.json
            source/build/plugins.json
            source/**/*.cs3
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish validated build to builds branch
    needs: build
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: cloudstream-publish
      cancel-in-progress: false
    steps:
      - name: Download the exact validated build
        uses: actions/download-artifact@v8
        with:
          name: cloudstream-plugin-build
          path: publish-input

      - name: Publish to builds branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          if git ls-remote --heads "${REMOTE}" refs/heads/builds | grep -q refs/heads/builds; then
            git clone --depth 1 --single-branch --branch builds "${REMOTE}" publish
          else
            mkdir publish
            git -C publish init --initial-branch=builds
            git -C publish remote add origin "${REMOTE}"
          fi

          find publish -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp publish-input/repo.json publish/repo.json
          cp publish-input/build/plugins.json publish/plugins.json
          find publish-input -type f -name '*.cs3' -exec cp {} publish/ \\;

          count=$(find publish -maxdepth 1 -type f -name '*.cs3' | wc -l)
          test "${count}" -ge 1
          python - <<'PY'
          import json
          from pathlib import Path

          index = json.loads(Path("publish/plugins.json").read_text(encoding="utf-8"))
          if not isinstance(index, list) or not index:
              raise SystemExit("plugins.json is empty or has an unexpected format")
          print(f"Publishing {len(index)} index entries and {len(list(Path('publish').glob('*.cs3')))} .cs3 artifact(s)")
          PY

          git -C publish config user.name "github-actions[bot]"
          git -C publish config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C publish add -A
          if git -C publish diff --cached --quiet; then
            echo "No build output changes to publish."
            exit 0
          fi
          git -C publish commit -m "Publish CloudStream plugin for ${GITHUB_SHA::7}"
          git -C publish push origin builds
